name: Telegram Proxy Collector

on:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-proxy-collector
  cancel-in-progress: false

jobs:

  collect:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # RUN COLLECTOR
      # ======================================================

      - name: Collect Telegram proxies
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNELS: ${{ secrets.TG_CHANNELS }}
        run: |
          python src/collector.py

      # ======================================================
      # SHOW RESULT
      # ======================================================

      - name: Show subscription statistics
        run: |
          echo "========================================"
          echo "Subscription statistics"
          echo "========================================"

          if [ -f output/proxies.txt ]; then
            echo "Active proxies: $(wc -l < output/proxies.txt)"
          else
            echo "Active proxies: 0"
          fi

      # ======================================================
      # COMMIT
      # ======================================================

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/state.json
          git add output/proxies.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update telegram proxies"

          git push
